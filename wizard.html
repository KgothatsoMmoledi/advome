<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advome | Guided Matter Wizard</title>
<link rel="stylesheet" href="shared-styles.css">
<style>
.wizard-container { max-width: 900px; margin: 0 auto; padding: 24px; }
.wizard-progress { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 32px; padding: 20px; background: var(--card-bg); border-radius: var(--radius); border: 1px solid var(--border); }
.wizard-step-dot { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; background: var(--bg); color: var(--text-muted); border: 2px solid var(--border); transition: var(--transition); }
.wizard-step-dot.active { background: var(--primary-gradient); color: white; border-color: var(--primary); transform: scale(1.1); }
.wizard-step-dot.completed { background: var(--secondary); color: white; border-color: var(--secondary); }
.wizard-step-label { font-size: 11px; color: var(--text-muted); text-align: center; margin-top: 6px; max-width: 80px; }
.wizard-step-connector { width: 40px; height: 2px; background: var(--border); transition: var(--transition); }
.wizard-step-connector.completed { background: var(--secondary); }
.wizard-content { background: var(--card-bg); border-radius: var(--radius-lg); border: 1px solid var(--border); padding: 40px; min-height: 500px; box-shadow: var(--shadow); }
.wizard-title { font-size: 24px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
.wizard-subtitle { font-size: 15px; color: var(--text-muted); margin-bottom: 32px; }
.wizard-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--border); }
.wizard-nav-btn { display: flex; align-items: center; gap: 8px; padding: 12px 24px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; cursor: pointer; transition: var(--transition); border: none; }
.wizard-nav-btn.prev { background: var(--bg); color: var(--text-muted); }
.wizard-nav-btn.prev:hover { background: var(--border); color: var(--text); }
.wizard-nav-btn.next { background: var(--primary-gradient); color: white; }
.wizard-nav-btn.next:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
.wizard-nav-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.guide-card { background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%); border: 1px solid var(--primary-light); border-radius: var(--radius); padding: 24px; margin-bottom: 20px; }
.guide-card-title { font-size: 16px; font-weight: 600; color: var(--primary-dark); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.guide-card-text { font-size: 14px; color: var(--text-muted); line-height: 1.6; }
.guide-card-action { margin-top: 16px; }
.wizard-upload { border: 2px dashed var(--primary-light); border-radius: var(--radius); padding: 48px 24px; text-align: center; cursor: pointer; transition: var(--transition); background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%); }
.wizard-upload:hover { border-color: var(--primary); background: linear-gradient(135deg, #e0f2fe 0%, #dbeafe 100%); }
.wizard-upload-icon { font-size: 48px; margin-bottom: 16px; }
.wizard-upload-title { font-size: 18px; font-weight: 600; color: var(--primary-dark); margin-bottom: 8px; }
.wizard-upload-sub { font-size: 14px; color: var(--text-muted); }
.detection-result { background: var(--bg); border-radius: var(--radius); padding: 24px; margin-top: 20px; animation: fadeIn 0.4s ease; }
.detection-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
.detection-badge { padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; text-transform: uppercase; }
.detection-badge.detected { background: #e6f4ea; color: var(--secondary); }
.detection-badge.unknown { background: #fef3cd; color: #856404; }
.detection-title { font-size: 18px; font-weight: 600; }
.detection-meta { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
.detection-meta-item { background: white; padding: 12px; border-radius: var(--radius-sm); border: 1px solid var(--border); }
.detection-meta-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
.detection-meta-value { font-size: 14px; font-weight: 600; color: var(--text); }
.action-steps { display: flex; flex-direction: column; gap: 12px; }
.action-step { display: flex; align-items: center; gap: 16px; padding: 16px 20px; background: white; border-radius: var(--radius-sm); border: 1px solid var(--border); cursor: pointer; transition: var(--transition); }
.action-step:hover { border-color: var(--primary); box-shadow: var(--shadow); transform: translateX(4px); }
.action-step-num { width: 32px; height: 32px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; flex-shrink: 0; }
.action-step-content { flex: 1; }
.action-step-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
.action-step-desc { font-size: 12px; color: var(--text-muted); }
.action-step-arrow { color: var(--primary); font-size: 18px; font-weight: 700; }
.template-form { display: flex; flex-direction: column; gap: 20px; }
.form-field { display: flex; flex-direction: column; gap: 6px; }
.form-field label { font-size: 13px; font-weight: 600; color: var(--text); }
.form-field input, .form-field select, .form-field textarea { padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; font-family: var(--font); transition: var(--transition); }
.form-field input:focus, .form-field select:focus, .form-field textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(26, 95, 180, 0.1); }
.template-output-box { background: #f8fafc; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 24px; margin-top: 20px; font-family: 'Georgia', serif; line-height: 1.8; white-space: pre-wrap; max-height: 500px; overflow-y: auto; font-size: 13px; }
.context-sidebar { position: fixed; right: 24px; top: 100px; width: 260px; background: var(--card-bg); border-radius: var(--radius); border: 1px solid var(--border); padding: 20px; box-shadow: var(--shadow); z-index: 50; }
.context-sidebar-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.context-item { display: flex; align-items: center; gap: 8px; padding: 8px 0; font-size: 12px; color: var(--text-muted); border-bottom: 1px solid var(--border); }
.context-item:last-child { border-bottom: none; }
.context-item.active { color: var(--primary); font-weight: 600; }
.context-item.completed { color: var(--secondary); }
.context-item .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); flex-shrink: 0; }
.context-item.active .dot { background: var(--primary); }
.context-item.completed .dot { background: var(--secondary); }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.hidden { display: none !important; }
@media (max-width: 1200px) { .context-sidebar { display: none; } }
</style>
</head>
<body>

<header class="site-header">
  <a href="index.html" class="brand">
    <div class="brand-mark">A</div>
    <div>
      <div class="brand-text">Advome</div>
      <div class="brand-sub">Guided self-representation</div>
    </div>
  </a>
  <nav class="main-nav">
    <a href="index.html" class="nav-link">Home</a>
    <a href="wizard.html" class="nav-link active">Wizard</a>
    <a href="dashboard.html" class="nav-link">Dashboard</a>
    <a href="attorney.html" class="nav-link">Attorney</a>
    <a href="pricing.html" class="nav-premium">Pricing</a>
  </nav>
</header>

<div class="wizard-container">

  <div class="wizard-progress" id="wizardProgress"></div>

  <div class="wizard-content" id="wizardContent"></div>

  <div class="wizard-actions" id="wizardActions">
    <button class="wizard-nav-btn prev" id="btnPrev" onclick="prevStep()">
      <span>&larr;</span> Back
    </button>
    <button class="wizard-nav-btn next" id="btnNext" onclick="nextStep()">
      Next <span>&rarr;</span>
    </button>
  </div>

</div>

<div class="context-sidebar" id="contextSidebar">
  <div class="context-sidebar-title">Your Matter</div>
  <div id="contextItems"></div>
</div>

<script>
let currentStep = 0;
let matterData = { type: null, detectedDocument: null, stage: null, userInputs: {}, generatedTemplate: null, documents: [] };

const workflows = {
  labour: [
    { id: 'upload', title: 'Upload Document', label: 'Upload' },
    { id: 'detect', title: 'Detect and Review', label: 'Detect' },
    { id: 'decision', title: 'Make Decision', label: 'Decide' },
    { id: 'generate', title: 'Generate Documents', label: 'Draft' },
    { id: 'review', title: 'Review and Edit', label: 'Review' },
    { id: 'next', title: 'Next Steps', label: 'Next' }
  ],
  divorce: [
    { id: 'upload', title: 'Upload Document', label: 'Upload' },
    { id: 'detect', title: 'Detect and Review', label: 'Detect' },
    { id: 'status', title: 'Matter Status', label: 'Status' },
    { id: 'generate', title: 'Generate Documents', label: 'Draft' },
    { id: 'children', title: 'Children and Settlement', label: 'Children' },
    { id: 'next', title: 'Next Steps', label: 'Next' }
  ],
  estates: [
    { id: 'upload', title: 'Upload Document', label: 'Upload' },
    { id: 'detect', title: 'Detect and Review', label: 'Detect' },
    { id: 'reporting', title: 'Reporting Pack', label: 'Report' },
    { id: 'generate', title: 'Generate Documents', label: 'Draft' },
    { id: 'lodgement', title: 'Lodgement', label: 'Lodge' },
    { id: 'next', title: 'Next Steps', label: 'Next' }
  ]
};

let currentWorkflow = null;

function renderProgress() {
  if (!currentWorkflow) return;
  const container = document.getElementById('wizardProgress');
  let html = '';
  currentWorkflow.forEach((step, index) => {
    const isCompleted = index < currentStep;
    const isActive = index === currentStep;
    if (index > 0) html += '<div class="wizard-step-connector ' + (isCompleted ? 'completed' : '') + '"></div>';
    html += '<div style="display:flex;flex-direction:column;align-items:center;"><div class="wizard-step-dot ' + (isActive ? 'active' : '') + ' ' + (isCompleted ? 'completed' : '') + '">' + (isCompleted ? '&#10003;' : index + 1) + '</div><div class="wizard-step-label">' + step.label + '</div></div>';
  });
  container.innerHTML = html;
}

function renderContext() {
  if (!currentWorkflow) return;
  const container = document.getElementById('contextItems');
  let html = '';
  currentWorkflow.forEach((step, index) => {
    let status = '';
    if (index < currentStep) status = 'completed';
    else if (index === currentStep) status = 'active';
    html += '<div class="context-item ' + status + '"><div class="dot"></div><span>' + step.title + '</span></div>';
  });
  container.innerHTML = html;
}

function renderStep() {
  if (!currentWorkflow) { renderMatterSelection(); return; }
  const step = currentWorkflow[currentStep];
  renderProgress();
  renderContext();
  document.getElementById('btnPrev').disabled = currentStep === 0;
  document.getElementById('btnNext').innerHTML = currentStep === currentWorkflow.length - 1 ? 'Finish &#10003;' : 'Next &rarr;';
  const contentDiv = document.getElementById('wizardContent');
  switch(step.id) {
    case 'upload': renderUploadStep(contentDiv); break;
    case 'detect': renderDetectStep(contentDiv); break;
    case 'decision': renderDecisionStep(contentDiv); break;
    case 'status': renderStatusStep(contentDiv); break;
    case 'reporting': renderReportingStep(contentDiv); break;
    case 'generate': renderGenerateStep(contentDiv); break;
    case 'children': renderChildrenStep(contentDiv); break;
    case 'lodgement': renderLodgementStep(contentDiv); break;
    case 'review': renderReviewStep(contentDiv); break;
    case 'next': renderNextStepsStep(contentDiv); break;
    default: renderUploadStep(contentDiv);
  }
}

function renderMatterSelection() {
  const contentDiv = document.getElementById('wizardContent');
  contentDiv.innerHTML = '<div class="text-center" style="padding:40px 0;"><div style="font-size:48px;margin-bottom:16px;">&#128196;</div><div class="wizard-title">What legal matter are you dealing with?</div><div class="wizard-subtitle">Select your matter type to begin the guided process. You can also upload a document and we will detect it automatically.</div><div class="grid-2" style="margin-top:32px;"><div class="card" style="cursor:pointer;" onclick="startWorkflow('labour')"><div style="font-size:32px;margin-bottom:12px;">&#9878;</div><div style="font-size:16px;font-weight:600;margin-bottom:8px;">CCMA / Labour Dispute</div><div style="font-size:13px;color:var(--text-muted);">Unfair dismissal, arbitration awards, Labour Court review</div></div><div class="card" style="cursor:pointer;" onclick="startWorkflow('divorce')"><div style="font-size:32px;margin-bottom:12px;">&#128148;</div><div style="font-size:16px;font-weight:600;margin-bottom:8px;">Divorce and Family Law</div><div style="font-size:13px;color:var(--text-muted);">Divorce proceedings, settlement, children, maintenance</div></div><div class="card" style="cursor:pointer;" onclick="startWorkflow('estates')"><div style="font-size:32px;margin-bottom:12px;">&#127963;</div><div style="font-size:16px;font-weight:600;margin-bottom:8px;">Deceased Estate</div><div style="font-size:13px;color:var(--text-muted);">Estate administration, Master's Office, distribution</div></div><div class="card" style="cursor:pointer;" onclick="startWorkflow('labour')"><div style="font-size:32px;margin-bottom:12px;">&#128269;</div><div style="font-size:16px;font-weight:600;margin-bottom:8px;">I Don't Know / Detect for Me</div><div style="font-size:13px;color:var(--text-muted);">Upload any document and we will identify the matter type</div></div></div></div>';
  document.getElementById('btnPrev').disabled = true;
  document.getElementById('btnNext').style.display = 'none';
  document.getElementById('wizardProgress').style.display = 'none';
  document.getElementById('contextSidebar').style.display = 'none';
}

function startWorkflow(type) {
  matterData.type = type;
  currentWorkflow = workflows[type] || workflows.labour;
  currentStep = 0;
  document.getElementById('wizardProgress').style.display = 'flex';
  document.getElementById('contextSidebar').style.display = 'block';
  document.getElementById('btnNext').style.display = 'flex';
  renderStep();
}

function renderUploadStep(container) {
  container.innerHTML = '<div class="wizard-title">Upload Your Document</div><div class="wizard-subtitle">Upload any legal document — a summons, CCMA award, death notice, or court letter. We will analyze it and guide you forward.</div><div class="wizard-upload" onclick="document.getElementById('wizardFileInput').click()"><div class="wizard-upload-icon">&#128228;</div><div class="wizard-upload-title">Click to Upload or Drag and Drop</div><div class="wizard-upload-sub">PDF, Word, or image files accepted (max 10MB)</div><input type="file" id="wizardFileInput" style="display:none;" accept=".pdf,.doc,.docx,.png,.jpg" onchange="handleWizardUpload(this)"></div><div class="guide-card" style="margin-top:24px;"><div class="guide-card-title">&#128203; What documents can I upload?</div><div class="guide-card-text"><strong>Labour matters:</strong> CCMA referral form, arbitration award, notice of motion, Labour Court correspondence<br><strong>Divorce matters:</strong> Summons, plea, settlement agreement, parenting plan, Rule 43 application<br><strong>Estate matters:</strong> Death notice (J294), inventory (J192), L and D account (J243), Master's Office letter</div></div><div class="guide-card"><div class="guide-card-title">&#9888; Important</div><div class="guide-card-text">Advome analyzes your document to identify the type and stage, but <strong>does not store or share your document content</strong> beyond what is needed for the analysis. Your document remains your property. We recommend removing sensitive personal information (ID numbers, bank details) before uploading if you are concerned about privacy.</div></div>';
}

function handleWizardUpload(input) {
  const file = input.files[0];
  if (!file) return;
  simulateDetection(file);
}

function simulateDetection(file) {
  const fname = file.name.toLowerCase();
  let result = { document_type: 'Unknown Document', confidence: 'Medium', detected_stage: 'Requires Manual Review', matter_category: 'unknown', next_steps: ['Review document manually', 'Select correct matter type'], extracted_data: {}, recommended_workflow: 'start.html', urgency: 'neutral' };
  if (fname.includes('award') || fname.includes('arbitration')) {
    result = { document_type: 'CCMA Arbitration Award', confidence: 'High', detected_stage: 'Award Received', matter_category: 'labour', next_steps: ['Record the service date', 'Read the award carefully', 'Decide: accept or challenge within 6 weeks'], extracted_data: { award_date: '2026-05-15', commissioner: 'Commissioner Smith', outcome: 'Dismissal upheld' }, recommended_workflow: 'award.html', urgency: 'attention' };
  } else if (fname.includes('summons') || fname.includes('divorce')) {
    result = { document_type: 'Divorce Summons', confidence: 'High', detected_stage: 'Pleadings', matter_category: 'divorce', next_steps: ['Check service proof', 'Wait 10 days for plea or response', 'Track defended/undefended status'], extracted_data: { court: 'High Court', date: '2026-06-01' }, recommended_workflow: 'divorce.html', urgency: 'attention' };
  } else if (fname.includes('death') || fname.includes('j294')) {
    result = { document_type: 'Death Notice (J294)', confidence: 'High', detected_stage: 'Reporting', matter_category: 'estates', next_steps: ['Complete reporting pack', 'Draft covering letter', 'Lodge at Master's Office'], extracted_data: { form: 'J294', status: 'Initial reporting' }, recommended_workflow: 'estates-hub.html', urgency: 'neutral' };
  }
  matterData.detectedDocument = result;
  currentStep = 1;
  renderStep();
}

function renderDetectStep(container) {
  const doc = matterData.detectedDocument;
  if (!doc) { container.innerHTML = '<div class="wizard-title">No document detected</div><div class="wizard-subtitle">Please go back and upload a document.</div>'; return; }
  container.innerHTML = '<div class="wizard-title">Document Analysis Complete</div><div class="wizard-subtitle">We analyzed your document. Here is what we found and what you should do next.</div><div class="detection-result"><div class="detection-header"><span class="detection-badge ' + (doc.confidence === 'High' ? 'detected' : 'unknown') + '">' + doc.confidence + ' Confidence</span><span class="detection-title">' + doc.document_type + '</span></div><div class="detection-meta"><div class="detection-meta-item"><div class="detection-meta-label">Detected Stage</div><div class="detection-meta-value">' + doc.detected_stage + '</div></div><div class="detection-meta-item"><div class="detection-meta-label">Matter Category</div><div class="detection-meta-value">' + doc.matter_category + '</div></div><div class="detection-meta-item"><div class="detection-meta-label">Urgency</div><div class="detection-meta-value"><span class="pill ' + (doc.urgency === 'critical' ? 'pill-red' : doc.urgency === 'attention' ? 'pill-amber' : 'pill-neutral') + '">' + doc.urgency.toUpperCase() + '</span></div></div><div class="detection-meta-item"><div class="detection-meta-label">Recommended Page</div><div class="detection-meta-value">' + doc.recommended_workflow + '</div></div></div><div style="font-size:14px;font-weight:600;color:var(--text);margin-bottom:12px;">What You Need to Do Next:</div><div class="action-steps">' + doc.next_steps.map((step, i) => '<div class="action-step" onclick="handleActionStep(' + i + ')"><div class="action-step-num">' + (i + 1) + '</div><div class="action-step-content"><div class="action-step-title">' + step + '</div><div class="action-step-desc">Click to proceed with this step</div></div><div class="action-step-arrow">&rarr;</div></div>').join('') + '</div></div><div class="guide-card" style="margin-top:20px;"><div class="guide-card-title">&#9888; Is this detection correct?</div><div class="guide-card-text">If the document type or stage is wrong, you can <strong>manually select the correct matter type</strong> below. The detection is based on filename and content patterns and may not be 100% accurate for complex documents.</div><div class="guide-card-action"><select id="manualMatterSelect" onchange="manualSelectMatter(this.value)" style="padding:8px 12px;border-radius:6px;border:1px solid var(--border);"><option value="">-- Select correct matter type --</option><option value="labour">CCMA / Labour Dispute</option><option value="divorce">Divorce and Family Law</option><option value="estates">Deceased Estate</option></select></div></div>';
}

function handleActionStep(index) {
  currentStep = 2;
  renderStep();
}

function manualSelectMatter(type) {
  if (!type) return;
  matterData.type = type;
  currentWorkflow = workflows[type];
  currentStep = 1;
  renderStep();
}

function renderDecisionStep(container) {
  container.innerHTML = '<div class="wizard-title">Make Your Decision</div><div class="wizard-subtitle">The CCMA award has been served on you. You have 6 weeks from the service date to decide what to do. This is a critical deadline.</div><div class="grid-2"><div class="card" style="cursor:pointer;border:2px solid var(--secondary);" onclick="selectDecision('accept')"><div style="font-size:32px;margin-bottom:12px;">&#9989;</div><div style="font-size:16px;font-weight:700;margin-bottom:8px;">Accept the Award</div><div style="font-size:13px;color:var(--text-muted);">You are satisfied with the commissioner's decision. The matter will move to closure and finalisation.</div><div class="mt-2"><span class="pill pill-green">No further action needed</span></div></div><div class="card" style="cursor:pointer;border:2px solid var(--primary);" onclick="selectDecision('challenge')"><div style="font-size:32px;margin-bottom:12px;">&#9876;</div><div style="font-size:16px;font-weight:700;margin-bottom:8px;">Challenge the Award</div><div style="font-size:13px;color:var(--text-muted);">You believe the award is flawed. Open the Section 145 review path: motion, record, heads, set-down, and Labour Court hearing.</div><div class="mt-2"><span class="pill pill-red">6-week deadline applies</span></div></div></div><div class="guide-card" style="margin-top:20px;"><div class="guide-card-title">&#9200; Critical Deadline</div><div class="guide-card-text"><strong>Section 145(1) of the LRA:</strong> A review application must be lodged within <strong>6 weeks</strong> of the award being served. If you miss this deadline, you may lose your right to challenge the award.<br><br><strong>Service date:</strong> Not yet recorded<br><strong>Days remaining:</strong> 42 days (if served today)<br><strong>Status:</strong> <span class="pill pill-amber">URGENT</span></div></div><div class="guide-card"><div class="guide-card-title">&#128084; Not Sure What to Do?</div><div class="guide-card-text">If you are unsure whether to accept or challenge the award, <strong>consult an attorney immediately</strong>. Do not rely solely on this platform for legal advice. You can connect with an attorney through the Attorney Portal.</div><div class="guide-card-action"><a href="attorney.html" class="btn btn-outline btn-sm" target="_blank">Find an Attorney &rarr;</a></div></div>';
}

function selectDecision(decision) {
  matterData.decision = decision;
  if (decision === 'accept') {
    alert('You have chosen to accept the award. The matter will be marked for finalisation. You can track this in your Dashboard.');
    currentStep = 5;
  } else {
    currentStep = 3;
  }
  renderStep();
}

function renderStatusStep(container) {

function finishWizard() {
  alert('Your matter has been saved to your Dashboard. You can track progress, set deadlines, and upload documents there.');
  window.location.href = 'dashboard.html';

function nextStep() {
  if (!currentWorkflow) return;
  if (currentStep < currentWorkflow.length - 1) {
    currentStep++;
    renderStep();
  } else {
    finishWizard();
  }
}

function prevStep() {
  if (!currentWorkflow) return;
  if (currentStep > 0) {
    currentStep--;
    renderStep();
  }
}
